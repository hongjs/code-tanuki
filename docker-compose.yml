services:
  code-tanuki:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: code-tanuki
    ports:
      - '8082:3000'
      - '8083:3083'
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MCP_PORT=3083
      - CODE_TANUKI_BASE_URL=http://localhost:3000
      - DATA_DIR=/data/reviews
      - REVIEW_V2_DATA_DIR=/data/reviews-v2
      - TICKET_DATA_DIR=/data/jira-tickets
      - LOG_DIR=/logs
    env_file:
      - .env.local
    volumes:
      - ./data:/data
      - ./logs:/logs
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - code-tanuki-network

networks:
  code-tanuki-network:
    driver: bridge
